[workspace]
members = [
  "crates/cloudstack-application",
  "crates/cloudstack-core",
  "crates/cloudstack-gtk",
  "crates/cloudstack-renderer",
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["xuxian"]

[workspace.dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
