name: Bug 报告
description: 报告一个可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认问题发生在 Arch Linux + 原生 Wayland 环境，并搜索现有 Issue。
  - type: input
    id: version
    attributes:
      label: CloudStack 版本
      description: 例如 v0.2.2，或填写 commit SHA。
      placeholder: v0.2.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统环境
      description: 请填写 Arch 更新状态、桌面环境/合成器和显卡后端。
      placeholder: Arch rolling / Hyprland / Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 用最小步骤说明如何触发问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除凭据、个人路径和文章内容中的敏感信息。
      render: text
