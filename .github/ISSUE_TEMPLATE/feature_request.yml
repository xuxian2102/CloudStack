name: 功能建议
description: 提议一个与 CloudStack 目标一致的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        CloudStack 优先保持原生 GTK4、Markdown 源码编辑和透明 Git 工作流。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前工作流中的具体阻碍，而不只是想要的控件。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明你希望 CloudStack 如何工作，可以附界面草图或参考项目。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你目前如何解决这个问题，或考虑过哪些替代方案？
