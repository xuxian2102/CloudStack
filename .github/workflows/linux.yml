name: Arch Wayland CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Install native dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git rust gtk4 libadwaita gtksourceview5 webkitgtk-6.0 \
            sway dbus desktop-file-utils namcap ttf-dejavu
          setcap -r /usr/bin/sway
          useradd --create-home --shell /bin/bash cloudstack-ci

      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-bin: false

      - name: Check localized UI literals
        run: python3 scripts/check-i18n-hardcoded.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Check Arch package metadata
        run: |
          bash -n packaging/arch/PKGBUILD
          sh -n packaging/arch/cloudstack.sh
          bash -n test/package-layout.sh
          desktop-file-validate packaging/arch/dev.xuxian.cloudstack.desktop
          runuser --user cloudstack-ci -- \
            env HOME=/home/cloudstack-ci \
            BUILDDIR=/home/cloudstack-ci/build \
            PKGDEST=/home/cloudstack-ci/packages \
            SRCDEST=/home/cloudstack-ci/sources \
            SRCPKGDEST=/home/cloudstack-ci/source-packages \
            LOGDEST=/home/cloudstack-ci/logs \
            makepkg --printsrcinfo --dir "$GITHUB_WORKSPACE/packaging/arch" >/dev/null
          namcap_result=$(namcap packaging/arch/PKGBUILD)
          if [[ -n "$namcap_result" ]]; then
            printf '%s\n' "$namcap_result"
            exit 1
          fi

      - name: Build Wayland smoke binary
        run: cargo build -p cloudstack-gtk --features e2e --bin cloudstack --locked

      - name: Smoke test native GTK application
        run: |
          # GitHub's container blocks the unprivileged namespaces required by WebKit's
          # Bubblewrap sandbox. This exception is scoped to the isolated CI smoke only.
          runuser --user cloudstack-ci -- \
            env -u DISPLAY -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS \
            HOME=/home/cloudstack-ci PATH="$PATH" \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            bash test/native-wayland-smoke.sh target/debug/cloudstack
